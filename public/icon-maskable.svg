<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="maskableBgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1f1812" />
      <stop offset="70%" stop-color="#0c0d12" />
      <stop offset="100%" stop-color="#08080b" />
    </radialGradient>

    <linearGradient id="cortexxOrangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAA00" />
      <stop offset="50%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#DD3B00" />
    </linearGradient>

    <linearGradient id="cortexxDarkCircuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3440" />
      <stop offset="100%" stop-color="#12141A" />
    </linearGradient>

    <filter id="cortexxGlowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable icon (safe zone inside central 80%) -->
  <rect width="512" height="512" fill="url(#maskableBgGlow)" />

  <!-- Ambient Glow in safe zone -->
  <circle cx="256" cy="256" r="140" fill="url(#cortexxOrangeGlow)" opacity="0.28" filter="url(#cortexxGlowEffect)" />

  <!-- Scaled Brain Group with 15% safe padding (scale 3.5, centered: translate 81, 81) -->
  <g transform="translate(81, 81) scale(3.5)">
    <!-- LEFT HEMISPHERE -->
    <g>
      <path
        d="M 48 18 C 36 18 20 28 20 44 C 20 54 26 62 26 70 C 26 78 36 84 48 84 Z"
        fill="url(#cortexxOrangeGlow)"
        stroke="#FFE082"
        stroke-width="1.2"
      />
      <path d="M 48 26 L 36 26 L 30 32 L 25 32" stroke="#FFF7ED" stroke-width="2" stroke-linecap="round" />
      <path d="M 48 38 L 38 38 L 32 44 L 23 44" stroke="#FFF7ED" stroke-width="2" stroke-linecap="round" />
      <path d="M 48 50 L 32 50 L 28 56 L 24 64" stroke="#FFF7ED" stroke-width="2" stroke-linecap="round" />
      <path d="M 48 62 L 38 62 L 32 68 L 30 76" stroke="#FFF7ED" stroke-width="2" stroke-linecap="round" />
      <path d="M 48 74 L 40 74 L 38 78" stroke="#FFF7ED" stroke-width="2" stroke-linecap="round" />

      <circle cx="25" cy="32" r="2.5" fill="#FFFFFF" />
      <circle cx="23" cy="44" r="2.5" fill="#FFFFFF" />
      <circle cx="24" cy="64" r="2.5" fill="#FFFFFF" />
      <circle cx="30" cy="76" r="2.5" fill="#FFFFFF" />
      <circle cx="35" cy="50" r="2.2" fill="#FFE082" />
    </g>

    <!-- RIGHT HEMISPHERE -->
    <g>
      <path
        d="M 52 18 C 64 18 80 28 80 44 C 80 54 74 62 74 70 C 74 78 64 84 52 84 Z"
        fill="url(#cortexxDarkCircuit)"
        stroke="#4B5563"
        stroke-width="1.2"
      />
      <path d="M 52 26 L 64 26 L 70 32 L 75 32" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" opacity="0.95" />
      <path d="M 52 38 L 62 38 L 68 44 L 77 44" stroke="#FF6A00" stroke-width="1.8" stroke-linecap="round" opacity="0.95" />
      <path d="M 52 50 L 68 50 L 72 56 L 76 64" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" opacity="0.95" />
      <path d="M 52 62 L 62 62 L 68 68 L 70 76" stroke="#FF6A00" stroke-width="1.8" stroke-linecap="round" opacity="0.95" />
      <path d="M 52 74 L 60 74 L 62 78" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" opacity="0.95" />

      <circle cx="75" cy="32" r="2.3" fill="#93C5FD" />
      <circle cx="77" cy="44" r="2.6" fill="#FF8800" />
      <circle cx="76" cy="64" r="2.3" fill="#93C5FD" />
      <circle cx="70" cy="76" r="2.3" fill="#FF8800" />
    </g>
  </g>
</svg>
